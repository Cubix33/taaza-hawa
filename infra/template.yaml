AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Taaza Hawa - station-air freshness, calibrated intervals and a self-grading ledger.

# Deploy:  sam build -t infra/template.yaml && sam deploy --guided --region ap-south-1
# (run from the repo root; CodeUri paths below are relative to this file)

Parameters:
  WaqiToken:
    Type: String
    NoEcho: true
  SesSender:
    Type: String
    Default: ""
    Description: Verified SES sender address; empty disables receipt emails.
  BedrockModelId:
    Type: String
    Default: ""
    Description: e.g. in.anthropic.claude-haiku-4-5-20251001-v1:0 ; empty disables the Hindi rephrase.
  TypeSafeApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: TypeSafe Jev key; empty disables free-text classification.
  TypeSafeModel:
    Type: String
    Default: "jev-1.13.0"
  SiteUrl:
    Type: String
    Default: "https://main.d2r1frd99buxhf.amplifyapp.com"
    Description: Public website URL, used for links in school emails.
  FirmsMapKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Free NASA FIRMS map key (firms.modaps.eosdis.nasa.gov/api/map_key); empty hides the fire count.
  DefaultStationUid:
    Type: String
    Default: "0"
    Description: WAQI uid of the default station (Dwarka Sector 8).
  ForecastMode:
    Type: String
    Default: on
    AllowedValues: [off, shadow, on]
    Description: shadow grades Chronos forecasts privately; on exposes them after the backtest gate.

Globals:
  Function:
    MemorySize: 256
    Timeout: 30
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref Table

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ---- the grading ledger's state machine -------------------------------------------------
  HoldStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      DefinitionUri: hold.asl.json
      DefinitionSubstitutions:
        RegisterFnArn: !GetAtt HoldRegisterFn.Arn
        ExpireFnArn: !GetAtt HoldExpireFn.Arn
        NotifyFnArn: !GetAtt HoldNotifyFn.Arn
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref HoldRegisterFn }
        - LambdaInvokePolicy: { FunctionName: !Ref HoldExpireFn }
        - LambdaInvokePolicy: { FunctionName: !Ref HoldNotifyFn }

  HoldRegisterFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      CodeUri: ../backend/src/
      Handler: handlers.hold_tasks.register
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - { Effect: Allow, Action: states:SendTaskSuccess, Resource: "*" }

  HoldExpireFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      CodeUri: ../backend/src/
      Handler: handlers.hold_tasks.expire
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }

  HoldNotifyFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      CodeUri: ../backend/src/
      Handler: handlers.hold_tasks.notify
      Environment:
        Variables:
          SES_SENDER: !Ref SesSender
      Policies:
        - Statement:
            - { Effect: Allow, Action: ses:SendEmail, Resource: "*" }

  # ---- polling, morning promises + school plans, bulletin quote -----------------------------
  PollerFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      CodeUri: ../backend/src/
      Handler: handlers.poller.handler
      Timeout: 120
      Environment:
        Variables:
          WAQI_TOKEN: !Ref WaqiToken
          SES_SENDER: !Ref SesSender
          SITE_URL: !Ref SiteUrl
          FIRMS_MAP_KEY: !Ref FirmsMapKey
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - { Effect: Allow, Action: states:SendTaskSuccess, Resource: "*" }
        - Statement:
            - { Effect: Allow, Action: ses:SendEmail, Resource: "*" }
      Events:
        Poll:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(15 minutes)
            Input: '{"task":"poll"}'
        Morning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"task":"morning"}'
        Bulletin:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 17 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata
            Input: '{"task":"bulletin"}'

  # ---- public API (Lambda Function URL, no API Gateway needed) ----------------------------
  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures: [arm64]
      CodeUri: ../backend/src/
      Handler: handlers.api.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref HoldStateMachine
          SES_SENDER: !Ref SesSender
          DEFAULT_STATION_UID: !Ref DefaultStationUid
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEDROCK_REGION: !Ref AWS::Region
          JEV_API_KEY: !Ref TypeSafeApiKey
          JEV_MODEL: !Ref TypeSafeModel
          JEV_TIMEOUT_MS: "1500"
          SITE_URL: !Ref SiteUrl
          FORECAST_MODE: !Ref ForecastMode
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins: ["*"]
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt HoldStateMachine.Name }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: "*"
        - Statement:
            - { Effect: Allow, Action: polly:SynthesizeSpeech, Resource: "*" }
        - Statement:
            - { Effect: Allow, Action: ses:SendEmail, Resource: "*" }
        - Statement:  # school search (Amazon Location Service, Places)
            - { Effect: Allow, Action: geo-places:SearchText, Resource: "*" }

  ForecastFn:
    Type: AWS::Serverless::Function
    Metadata:
      Dockerfile: Dockerfile.forecast
      DockerContext: ../backend
      DockerTag: chronos-bolt-tiny-a0e552d
    Properties:
      PackageType: Image
      Architectures: [x86_64]
      MemorySize: 2048
      Timeout: 300
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          FORECAST_MODE: !Ref ForecastMode
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
      Events:
        HourlyForecast:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(20 * * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  PollFailAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Poller failing - the app will say how old its feed is.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref PollerFn }]
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-ops-alerts"
      DisplayName: Taaza Hawa Operations Alert Notification

  OpsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-OpsDashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Invocations and Latency",
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "${ApiFn}", { "stat": "Sum" }],
                  [".", "Invocations", "FunctionName", "${PollerFn}", { "stat": "Sum" }],
                  [".", "Duration", "FunctionName", "${ApiFn}", { "stat": "p99", "yAxis": "right" }]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "Step Functions Hold State Machine Executions",
                "metrics": [
                  ["AWS/States", "ExecutionsStarted", "StateMachineArn", "${HoldStateMachine}", { "stat": "Sum" }],
                  [".", "ExecutionsSucceeded", "StateMachineArn", "${HoldStateMachine}", { "stat": "Sum" }],
                  [".", "ExecutionTime", "StateMachineArn", "${HoldStateMachine}", { "stat": "Average", "yAxis": "right" }]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "DynamoDB Storage and Consumed Capacity",
                "metrics": [
                  ["AWS/DynamoDB", "ConsumedReadCapacityUnits", "TableName", "${Table}", { "stat": "Sum" }],
                  [".", "ConsumedWriteCapacityUnits", "TableName", "${Table}", { "stat": "Sum" }]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 6, "width": 12, "height": 6,
              "properties": {
                "title": "Lambda Errors and Failures",
                "metrics": [
                  ["AWS/Lambda", "Errors", "FunctionName", "${PollerFn}", { "stat": "Sum" }],
                  [".", "Errors", "FunctionName", "${ApiFn}", { "stat": "Sum" }],
                  [".", "Errors", "FunctionName", "${ForecastFn}", { "stat": "Sum" }]
                ],
                "period": 300,
                "region": "${AWS::Region}"
              }
            }
          ]
        }

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-MonthlyBudget"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5.0
          Unit: USD

Outputs:
  ApiUrl:
    Value: !GetAtt ApiFnUrl.FunctionUrl
  StateMachineArn:
    Value: !Ref HoldStateMachine
  AlertTopicArn:
    Value: !Ref AlertTopic
  DashboardName:
    Value: !Ref OpsDashboard
